[project]
name = "ealna-node"
version = "0.3.0"
description = "Ealna Node — private, green, OpenAI-compatible AI inference behind the Veil."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ealna" }]
dependencies = ["fastapi", "uvicorn[standard]", "httpx", "pydantic"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://ealna.com"
Docs = "https://ealna.com/docs"
Source = "https://github.com/ealna/ealna-node"

[project.scripts]
ealna-node = "ealna_node.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
